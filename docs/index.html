<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#C4614A">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>POSEIDON — Rise of the Steel Tribes</title>
  <style>
    * { margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none; }
    html,body { width:100%;height:100%;overflow:hidden;background:#0D0A08;display:flex;align-items:center;justify-content:center; }
    #game-container { width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden; }
    canvas { display:block;touch-action:none; }
    #loading-screen { position:fixed;inset:0;background:#0D0A08;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:'Georgia',serif;color:#EDE4D3;transition:opacity 0.8s ease; }
    #loading-screen.hidden { opacity:0;pointer-events:none; }
    .loading-title { font-size:42px;font-weight:bold;letter-spacing:8px;text-transform:uppercase;color:#C4614A;text-shadow:0 0 30px rgba(196,97,74,0.6);margin-bottom:8px; }
    .loading-subtitle { font-size:12px;letter-spacing:4px;color:#8B7355;margin-bottom:60px;text-transform:uppercase; }
    .loading-bar-container { width:200px;height:3px;background:#2A1F1A;border-radius:2px;overflow:hidden; }
    .loading-bar { height:100%;background:linear-gradient(90deg,#C4614A,#8B5E52);width:0%;transition:width 0.3s ease;border-radius:2px; }
    .loading-text { margin-top:16px;font-size:10px;letter-spacing:2px;color:#5A4A3A;text-transform:uppercase; }
  </style>
  <script>
    (function(){
      // Loading screen
      function hideLoader(){var s=document.getElementById('loading-screen');if(s){s.style.transition='opacity 0.8s ease';s.style.opacity='0';s.style.pointerEvents='none';setTimeout(function(){if(s&&s.parentNode)s.parentNode.removeChild(s);},900);}}
      window._hideLoader=hideLoader;
      setTimeout(hideLoader,12000);

      // Debug overlay — shows JS errors and scene transitions on screen
      window._dbg = function(msg) {
        var d = document.getElementById('_dbg');
        if (d) { d.style.display='block'; d.textContent = msg; }
      };
      window.onerror = function(msg, src, line) {
        window._dbg('ERR: ' + msg + ' [L' + line + ']');
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        window._dbg('ASYNC ERR: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
      });

      // PWA service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').catch(function(){});
        });
      }
    })();
  </script>
  <script type="module" crossorigin src="./assets/index-DVVt55NH.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/phaser-0RJB29YE.js">
</head>
<body>
  <div id="loading-screen">
    <div class="loading-title">POSEIDON</div>
    <div class="loading-subtitle">Rise of the Steel Tribes</div>
    <div class="loading-bar-container"><div class="loading-bar" id="loading-bar"></div></div>
    <div class="loading-text" id="loading-text">Forging the world...</div>
  </div>
  <div id="game-container"></div>
  <div id="_dbg" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#C4614A;color:#fff;padding:8px 12px;font-family:monospace;font-size:12px;z-index:99999;word-break:break-all;min-height:32px;"></div>
</body>
</html>
